name: Update RIPE Atlas data and deploy checker

on:
  schedule:
    # Run once daily, after all three previous-day slots are complete.
    - cron: "0 2 * * *"

  workflow_dispatch:
    inputs:
      date:
        description: "Historical UTC date (YYYY-MM-DD); blank means yesterday"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: interactive_checker
        run: pip install -r requirements.txt

      - name: Fetch yesterday's 06:00, 12:00 and 18:00 UTC measurements
        working-directory: interactive_checker
        env:
          REQUESTED_DATE: ${{ inputs.date }}
        run: |
          args=()
          if [ -n "$REQUESTED_DATE" ]; then
            args+=(--date "$REQUESTED_DATE")
          fi
          python fetch_data.py \
            "${args[@]}" \
            --root-locations root_locations.csv \
            --site-dir site

      - name: Commit generated data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add interactive_checker/data/ interactive_checker/site/data/

          if git diff --cached --quiet; then
            echo "No generated data changes"
          else
            git commit -m "Update historical RIPE Atlas daily data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: interactive_checker/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
